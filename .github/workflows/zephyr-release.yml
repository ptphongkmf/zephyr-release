name: Zephyr Release

on:
  push:
    branches:
      - main 

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zephyr-release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - name: Generate App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.WAYFEA_APP_ID }}
          private-key: ${{ secrets.WAYFEA_PRIVATE_KEY }}

      - name: Run Zephyr Release
        uses: ptphongkmf/zephyr-release@v0.12.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          config-path: ".zephyr-release/config.json"
          config-format: "json"